site_name: Hannah
site_description: Public documentation for Hannah, a self-hosted, German-speaking voice assistant for smart homes.
site_url: https://hannah-docs.leonie.network/

repo_url: https://github.com/Leonie-Network/hannah-docs
repo_name: Leonie-Network/hannah-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.suggest

nav:
  - Start: index.md
  - Handbuch:
      - Installation: manual/installation.md
      - Nutzerverwaltung: manual/users.md
      - Satelliten verwalten: manual/satellites.md
      - Smart-Home-Integration: manual/smart-home-integration.md
      - Erweiterte Einstellungen: manual/settings.md
      - Automatisierung:
          - Trigger: manual/triggers.md
          - Wecker: manual/alarms.md
      - Komponenten:
          - Übersicht: components/index.md
          - Core:
              - Übersicht: components/core/index.md
              - Installation: components/core/installation.md
              - Konfiguration: components/core/configuration.md
          - WebUI:
              - Übersicht: components/webui/index.md
              - Installation: components/webui/installation.md
              - Konfiguration: components/webui/configuration.md
              - Telegram-Verknüpfung einrichten: components/webui/telegram-login.md
              - Microsoft-Entra-Verknüpfung einrichten: components/webui/entra-login.md
          - Satellit:
              - Übersicht: components/satellite/index.md
              - Platine bestellen: components/satellite/pcb-order.md
              - Konfiguration: components/satellite/configuration.md
              - Lite-Satellit (PC): components/satellite/lite.md
          - Proxy:
              - Übersicht: components/proxy/index.md
              - Installation: components/proxy/installation.md
              - Konfiguration: components/proxy/configuration.md
          - Telegram:
              - Übersicht: components/telegram/index.md
              - Installation: components/telegram/installation.md
              - Konfiguration: components/telegram/configuration.md
          - Chat (Terminal):
              - Übersicht: components/chat/index.md
              - Installation: components/chat/installation.md
          - VoiceID:
              - Übersicht: components/voiceid/index.md
              - Installation: components/voiceid/installation.md
              - Konfiguration: components/voiceid/configuration.md
          - Timer:
              - Übersicht: components/timer/index.md
              - Installation: components/timer/installation.md
          - AutoDeploy:
              - Übersicht: components/autodeploy/index.md
              - Installation: components/autodeploy/installation.md
              - Konfiguration: components/autodeploy/configuration.md
          - Update-Server:
              - Übersicht: components/update-server/index.md
          - ioBroker-Adapter:
              - Übersicht: components/iobroker-adapter/index.md
              - Installation: components/iobroker-adapter/installation.md
              - Konfiguration: components/iobroker-adapter/configuration.md
              - Nutzung: components/iobroker-adapter/usage.md
      - Known Gaps: manual/known-gaps.md
  - Entwickler:
      - Architecture:
          - Overview: architecture/overview.md
          - System Map: architecture/infrastructure-map.md
          - Protocols:
              - gRPC: architecture/protocols/grpc.md
              - MQTT: architecture/protocols/mqtt.md
              - UDP: architecture/protocols/udp.md
      - Hardware:
          - Overview: hardware/overview.md
          - PCB Revisions: hardware/pcb-revisions.md
          - Components: hardware/components.md
          - Enclosure: hardware/enclosure.md
      - Development:
          - Getting Started: development/getting-started.md
      - Services:
          - Overview: services/overview.md
          - Proxy: services/proxy.md
          - Telegram: services/telegram.md
          - VoiceID: services/voiceid.md
          - Timer Service: services/timer.md
          - Asset Server: services/asset-server.md
          - Update Server: services/update-server.md
          - WebUI: services/webui.md

extra_javascript:
  - assets/js/compose-builder.js

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["includes"]
      auto_append:
        - abbreviations.md
  - toc:
      permalink: true
