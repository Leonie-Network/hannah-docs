site_name: Hannah
site_description: Public documentation for Hannah, a self-hosted, German-speaking voice assistant for smart homes.
site_url: https://hannah-docs.leonie.network/

repo_url: https://github.com/Leonie-Network/hannah-docs
repo_name: Leonie-Network/hannah-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.action.edit
    - search.suggest

nav:
  - Start: index.md
  - Handbuch:
      - Installation: manual/installation.md
      - Einstellungen: manual/settings.md
      - Known Gaps: manual/known-gaps.md
  - Entwickler:
      - Architecture:
          - Overview: architecture/overview.md
          - Protocols:
              - gRPC: architecture/protocols/grpc.md
              - MQTT: architecture/protocols/mqtt.md
              - UDP: architecture/protocols/udp.md
      - Hardware:
          - Overview: hardware/overview.md
          - PCB Revisions: hardware/pcb-revisions.md
          - Components: hardware/components.md
          - Enclosure: hardware/enclosure.md
      - Development:
          - Getting Started: development/getting-started.md
      - Services:
          - Overview: services/overview.md
          - Proxy: services/proxy.md
          - Telegram: services/telegram.md
          - VoiceID: services/voiceid.md
          - Timer Service: services/timer.md
          - Asset Server: services/asset-server.md
          - Update Server: services/update-server.md
          - WebUI: services/webui.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
